description: All golden tests
prompts:
  - "{{question}}"
defaultTest:
  assert:
    - type: latency
      threshold: 2000 # slowest prompt is 1350ms, setting threshold to 2000ms so that it catches latency slowdowns
  options: # sets the model for every similar check, but does not add the check
    provider:
      embedding:
        id: openai:embedding:nomic
        config: {apiBaseUrl: http://localhost:8082/v1, apiKeyRequired: false, useDefaultApiKey: false}
providers:
  - id: file://shopbot_provider.py
    config:
      pythonExecutable: ../.venv/bin/python
evaluateOptions:
  maxConcurrency: 1 # to measure correct latency rather than queue time
tests: file://golden_tests.py:create_tests